- id: F-35
  type: concepto-mixto
  title: El mismo caso — guiar estructura con EBNF
  subtitle: ''
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: '**Prompt + gramática simplificada:**'
      level: 0
  - type: list
    ordered: false
    items:
    - content: '**Efecto:**'
      level: 0
  - type: list
    ordered: false
    items:
    - content: ya no solo sugerimos forma,
      level: 0
    - content: definimos qué secuencias son válidas,
      level: 0
    - content: reducimos comas de más, campos faltantes o orden inválido.
      level: 0
  - type: text
    content: '> En sistemas actuales esto suele entrar como JSON Schema, tipos o CFG
      compilada para constrained decoding.

      > Acá usamos **EBNF como simplificación didáctica** de esa idea formal.'
  - type: list
    ordered: false
    items:
    - content: '**Apoyo actual:**'
      level: 0
  - type: list
    ordered: false
    items:
    - content: 'Para uso **explícito de EBNF** en un lenguaje de prompting para LLMs:
        Gong (2026) presenta SPL y reporta una gramática formal EBNF: [arXiv:2602.21257](https://arxiv.org/abs/2602.21257)'
      level: 0
    - content: 'Para *grammar-constrained decoding*: Alpay y Senturk (2026) analizan
        decoding guiado por CFG y sus costos estructurales: [arXiv:2603.05540](https://arxiv.org/abs/2603.05540)'
      level: 0
