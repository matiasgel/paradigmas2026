- id: F-16
  type: codigo
  title: Derivación de `A := B * (A + C)`
  subtitle: ''
  body_blocks:
  - type: text
    content: Cada paso aplica una producción.
  code_blocks:
  - lang: text
    content: '<assign>

      ⇒ <id> := <expr>

      ⇒ A := <expr>

      ⇒ A := <id> * <expr>

      ⇒ A := B * <expr>

      ⇒ A := B * (<expr>)

      ⇒ A := B * (<id> + <expr>)

      ⇒ A := B * (A + <expr>)

      ⇒ A := B * (A + <id>)

      ⇒ A := B * (A + C)'
