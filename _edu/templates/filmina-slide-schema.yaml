# Filmina Slide Schema v2 — Contrato inmutable por filmina
# Generado por BMAD Architect (Winston) — 19 de marzo de 2026
# Fuente: salida/planning-artifacts/arquitectura-pipeline-filminas-v2.md (sección 3.1)
#
# PROPÓSITO: Define el objeto canónico de cada slide individual en el plan YAML.
# Este schema es la fuente de verdad que validate_plan.py y slides_pipeline.py
# usan para verificar que el plan está completo antes de ejecutar cualquier API.
#
# REGLA: El agente es responsable de llenar todos los campos explícitamente.
#        El script NUNCA infiere, completa ni corrige campos faltantes.

$schema: "filmina/v2"
$id: "filmina-slide"
version: "2.0"
date: "2026-03-19"

# ---------------------------------------------------------------------------
# CAMPOS OBLIGATORIOS (required)
# ---------------------------------------------------------------------------
required:
  - id          # Identificador único: F-00, F-01, ..., F-39
  - type        # Tipo de slide — NUNCA inferido, SIEMPRE explícito
  - title       # Texto del título visible en la slide
  - body_blocks # Contenido del cuerpo — puede ser [] si type lo permite
  - layout      # Todas las zonas explícitas (ver properties.layout)
  - image       # Siempre presente; image.layer puede ser "none"

# ---------------------------------------------------------------------------
# PROPIEDADES
# ---------------------------------------------------------------------------
properties:

  id:
    type: string
    pattern: "^F-[0-9]{2}$"
    description: "Identificador único de la filmina. Debe ser F-00, F-01, ..., F-39."

  type:
    type: string
    description: >
      Tipo canónico de la filmina. OBLIGATORIO. NUNCA inferido por el script.
      Si falta → ValidationError. El agente asigna el tipo explícitamente.
    enum:
      - portada
      - concepto-abstracto
      - concepto-mixto      # texto izquierda + código derecha
      - codigo              # solo código (full-bottom)
      - tabla               # slide con tabla principal
      - tabla-comparativa   # tabla comparativa (dos columnas de comparación)
      - tabla-mixta         # texto/código izquierda + tabla derecha
      - diagrama            # imagen o diagrama significativo a la derecha
      - socratica           # pregunta socrática — imagen de fondo
      - demo                # demostración — código a la derecha
      - cierre              # filmina de cierre — imagen de fondo
      - timeline            # línea temporal o secuencia
    # NO HAY default. Si falta → ValidationError.

  title:
    type: string
    minLength: 1
    description: "Texto del título de la slide. No puede estar vacío."

  subtitle:
    type: string
    default: ""
    description: "Subtítulo opcional mostrado debajo del título."

  body_blocks:
    type: array
    description: "Bloques de contenido del cuerpo. Puede ser [] para slides sin cuerpo."
    items:
      oneOf:
        - type: object
          required: [type, content]
          properties:
            type: {const: "text"}
            content: {type: string}
        - type: object
          required: [type, level, content]
          properties:
            type: {const: "heading"}
            level: {type: integer, minimum: 1, maximum: 6}
            content: {type: string}
        - type: object
          required: [type, items]
          properties:
            type: {const: "list"}
            ordered: {type: boolean, default: false}
            items: {type: array, items: {type: string}}

  tables:
    type: array
    default: []
    description: "Tablas Markdown para slides tipo tabla, tabla-comparativa, tabla-mixta."
    items:
      type: object
      required: [headers, rows]
      properties:
        headers: {type: array, items: {type: string}}
        rows:    {type: array, items: {type: array, items: {type: string}}}

  code_blocks:
    type: array
    default: []
    description: "Bloques de código para slides tipo codigo, concepto-mixto, demo."
    items:
      type: object
      required: [lang, content]
      properties:
        lang:    {type: string, description: "Lenguaje del bloque: python, haskell, prolog, etc."}
        content: {type: string}

  layout:
    type: object
    description: >
      Distribución de zonas explícita. Todas las zonas deben declararse.
      NO hay "compute from type" — el agente asigna las zonas explícitamente
      o las toma de la tabla slide_types en slides-config.yaml.
    required: [title, body, image, code, table]
    properties:
      title:
        type: string
        enum: [center-middle, full-title, center-top, left-top]
      body:
        type: string
        enum: [center-bottom, left-middle, center-middle, subtitle-only,
               table-intro, full-center, full-bottom, left-top-split, none]
      image:
        type: string
        enum: [background, right-half, none]
      code:
        type: string
        enum: [right-half, full-bottom, left-bottom-split, none]
      table:
        type: string
        enum: [table-main, right-half, none]

  image:
    type: object
    description: >
      Objeto de imagen. SIEMPRE presente.
      Si no hay imagen para esta slide: image.layer = "none".
    required: [layer, prompt]
    properties:
      layer:
        type: string
        enum: [background, content, none]
        description: >
          - background: la imagen ocupa el fondo completo (portada, socratica, cierre)
          - content: la imagen es un elemento de contenido (concepto-abstracto, diagrama)
          - none: no hay imagen en esta slide
      prompt:
        type: string
        description: >
          CUANDO layer != "none": OBLIGATORIO. Vacío → ValidationError.

          REGLA ANTI-BUG 3 (crítica):
          El prompt DEBE usar EXCLUSIVAMENTE lenguaje visual puro.
          - Describir SOLO geometría: formas (circle, rectangle, branching tree),
            colores, tamaños y posiciones relativas.
          - NUNCA nombrar conceptos técnicos del tema (compilador, parser, semántica,
            paradigma, etc.) — Gemini los convierte en etiquetas de texto en inglés.
          - SIEMPRE terminar con: "Sin texto, sin letras, sin etiquetas, sin código,
            sin números."

          Template:
            "[Elemento]: [forma] [color] [posición].
             [Relación posicional]. Flat design, bordo y gris oscuro, fondo blanco.
             Sin texto, sin letras, sin etiquetas, sin código, sin números. Alta resolución."

          Ejemplo CORRECTO:
            "Three flat icons in a horizontal sequence on white background.
             First: blob shape bordo. Second: branching tree dark gray.
             Third: checkmark symbol. No text whatsoever."

          Ver guía completa: _edu/templates/prompt-imagen-guide.md
      local_asset:
        type: string
        default: ""
        description: "Ruta local al asset si ya fue generado (slides/assets/F-XX-*.png)."
      drive_id:
        type: ["string", "null"]
        default: null
        description: "Google Drive file ID después de subir el asset. null = aún no subido."

  table_assets:
    type: array
    default: []
    description: "Assets de tabla en PNG (generados con matplotlib) — para slides tipo tabla."
    items:
      type: object
      properties:
        local_asset: {type: string}
        drive_id:    {type: ["string", "null"], default: null}

# ---------------------------------------------------------------------------
# VALIDACIONES CRUZADAS (lógica semántica — implementadas en validate_plan.py)
# ---------------------------------------------------------------------------
cross_validations:
  - rule: "Si image.layer != 'none' → image.prompt no puede estar vacío"
    field: "image.prompt"
    error: "{id}.image.prompt vacío — image.layer={image.layer} requiere prompt"

  - rule: "El layout debe ser coherente con el type (según slide_types en slides-config.yaml)"
    field: "layout"
    error: "{id}.layout incoherente con type={type}"

  - rule: "Si type in ['codigo', 'concepto-mixto', 'demo'] → code_blocks no puede ser []"
    field: "code_blocks"
    error: "{id}.code_blocks vacío — type={type} requiere al menos un bloque de código"

  - rule: "Si type in ['tabla', 'tabla-comparativa', 'tabla-mixta'] → tables no puede ser []"
    field: "tables"
    error: "{id}.tables vacío — type={type} requiere al menos una tabla"

# ---------------------------------------------------------------------------
# LÍMITES GLOBALES DEL PLAN (verificados a nivel de plan, no de slide)
# ---------------------------------------------------------------------------
plan_level_rules:
  max_images:
    description: "La cantidad de slides con image.layer != 'none' no puede superar el budget"
    source: "_edu/slides-config.yaml → gemini_image_strategy.max_per_presentation"
    default: 12
    error: "Budget de imágenes superado: {count} slides con imagen, máximo={max}"

  no_pending_types:
    description: "El plan no puede tener slides con type: pending o type: null"
    error: "{id}.type es 'pending' o null — el agente debe asignar un tipo explícito"
