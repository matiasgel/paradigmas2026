# EDU — Academic Course Production Suite
# Standalone Configuration
# Version: 1.0.0
# Date: 2026-03-07

# --- Project ---
project_name: "Laboratorio de Programación y Lenguajes 2026"    # Nombre de la materia/curso
project_code: "IF009"                                           # Código institucional
institution: "Universidad Nacional de Tierra del Fuego — Instituto IDEI"
communication_language: "spanish"
document_output_language: "spanish"
user_name: "Matías Gel"              # Nombre del docente
course_year: "2026"
course_semester: "1ro"
course_total_hours: "90"
course_weeks: "17"

# --- Folder Structure ---
output_folder: "{project-root}/salida"
course_output_folder: "{output_folder}/cursadas"
memory_folder: "{project-root}/_edu-memory"

# --- Module ---
code: edu
name: "EDU: Academic Course Production Suite"
header: "Pipeline completo de producción docente universitaria con inteligencia pedagógica"
subheader: "Desde la ingesta del programa oficial hasta el cierre de cursada con validación automática y memoria acumulada año a año"

# --- Behavioral ---
default_professor_profile: "profesor-teorico"
default_class_duration: "180"          # 3 horas por sesión (teoría O práctica)
teoría_duration: "180"                 # minutos — sesión teórica
practica_duration: "180"               # minutos — sesión práctica
lms_provider: "moodle, google-classroom"
academic_guardrail_enabled: "true"
command_aliases: "true"

# --- Validators (S1.1 / S1.2 / S4.1) ---
accessibility_check_enabled: true
composition_check_enabled: true
cognitive_validation_enabled: true

# --- Course Structure ---
topics_folder: "salida/cursadas/2026/temas"    # carpeta donde viven los temas de la cursada activa
plan_folder: "salida/cursadas/2026"            # carpeta donde viven plan-minimo.md y plan-borrador.md

# --- Professor Profiles ---
# Available: profesor-teorico, profesor-practico, profesor-socratico, profesor-flipped, profesor-investigador
# Each profile affects cognitive density metrics used by academic-guardrail agent
