# Sistema de diseño para la exportación de filminas (Google Slides)
# Generado por /edu_slides_designer

# --- Template Google Slides ---
# Template base: https://docs.google.com/presentation/d/1pvGh0fba0vNAwN0Gt0RtrAxMwGiM8u91FYIFGA3UkJc/edit
template_id: "1pvGh0fba0vNAwN0Gt0RtrAxMwGiM8u91FYIFGA3UkJc"

# --- Paleta de colores ---
# Gama institucional — Poder Judicial de la Nación / Tierra del Fuego
# WCAG AA validado: primary/text sobre background ≥ 10:1 | texto blanco sobre primary ≥ 10:1
palette:
  primary: "#1B3A5C"      # Navy azul institucional PJN
  secondary: "#F0F4F8"    # Gris azulado suave — portadas, banners
  accent: "#C8932A"       # Dorado institucional — énfasis (solo títulos/headings grandes)
  background: "#FFFFFF"   # Blanco puro
  text: "#1A1A1A"         # Negro carbón — máxima legibilidad

# --- Tipografía (Google Fonts) ---
typography:
  title:
    font: "Lato"
    size: 32
    weight: "bold"
  subtitle:
    font: "Lato"
    size: 26
    weight: "regular"
  body:
    font: "Lato"
    size: 18
    weight: "regular"
  code:
    font: "Roboto Mono"
    size: 16
    weight: "regular"

# --- Layouts por tipo de filmina ---
# Estilo visual por zona para cada tipo canónico. Informativo para Vera y el agente publisher.
# El pipeline usa slide_types + pipeline-runtime para geometría. Este bloque define los estilos.
# ⚠️  secondary (#F0F4F8) es un color de FONDO, no de texto. No usar como color de texto.
# ✅  accent (#C8932A) solo como barra decorativa — no cumple WCAG AA como color de texto.
layouts:

  portada:
    # Zona full-title: nombre del curso centrado y grande
    # Zona center-bottom: institución y fecha
    # Imagen: fondo claro con forma geométrica abstracta
    title:
      font: title           # Lato Bold 32pt
      align: center
      color: primary        # Navy #1B3A5C sobre fondo blanco — ratio 10.4:1 ✅
    subtitle:
      font: subtitle        # Lato Regular 26pt
      align: center
      color: text           # Negro carbón #1A1A1A — ratio 19.6:1 ✅
    institution:
      font: body            # Lato Regular 18pt
      align: center
      color: text
    accent_bar:             # Barra decorativa inferior (solo decorativa, no texto)
      color: accent         # Dorado #C8932A
      position: bottom
    logo_position: bottom-right

  concepto-abstracto:
    # Zona left-middle: texto explicativo izquierda
    # Zona right-half: imagen Gemini derecha
    title:
      font: title
      align: left
      color: primary
    body:
      font: body
      align: left
      color: text
    image:
      position: right-half
      size: medium

  concepto-mixto:
    # Zona left-middle: texto explicativo izquierda
    # Zona right-half: bloque de código derecha (sin imagen)
    title:
      font: title
      align: left
      color: primary
    body:
      font: body
      align: left
      color: text
    code_block:
      font: code            # Roboto Mono 16pt
      background: "#F0F4F8" # Secondary: gris azulado suave
      border_color: primary # Navy
      border_width: 1

  codigo:
    # Zona subtitle-only: subtítulo breve arriba
    # Zona full-bottom: bloque de código ocupando la slide
    title:
      font: title
      align: left
      color: primary
    subtitle:
      font: body
      align: left
      color: text
    code_block:
      font: code
      background: "#F0F4F8"
      border_color: primary
      border_width: 1
      line_highlight_color: "#1B3A5C20"  # Navy con 12% opacidad para líneas activas

  tabla:
    # Zona table-intro: intro breve arriba
    # Zona table-main: tabla full-width centrada
    title:
      font: title
      align: left
      color: primary
    intro:
      font: body
      align: left
      color: text
    table:
      header_background: primary  # Navy #1B3A5C
      header_text: "#FFFFFF"      # Blanco sobre navy — ratio 10.4:1 ✅
      row_even: "#F0F4F8"         # Secondary gris azulado
      row_odd: "#FFFFFF"
      border_color: "#B0C4D8"     # Azul grisáceo suave

  tabla-comparativa:
    # Igual que tabla pero con borde de acento para comunicar comparación
    title:
      font: title
      align: left
      color: primary
    intro:
      font: body
      align: left
      color: text
    table:
      header_background: primary
      header_text: "#FFFFFF"
      row_even: "#F0F4F8"
      row_odd: "#FFFFFF"
      border_color: "#B0C4D8"
      accent_border_left: accent  # Línea dorada izquierda como indicador visual

  tabla-mixta:
    # Zona izquierda: texto arriba + código abajo
    # Zona right-half: tabla
    title:
      font: title
      align: left
      color: primary
    body:
      font: body
      align: left
      color: text
    code_block:
      font: code
      background: "#F0F4F8"
      border_color: primary
    table:
      header_background: primary
      header_text: "#FFFFFF"
      row_even: "#F0F4F8"
      row_odd: "#FFFFFF"
      border_color: "#B0C4D8"

  diagrama:
    # Zona left-middle: explicación del diagrama
    # Zona right-half: imagen/diagrama Gemini
    title:
      font: title
      align: left
      color: primary
    body:
      font: body
      align: left
      color: text
    image:
      position: right-half
      size: large

  socratica:
    # Zona center-top: pregunta corta y potente
    # Zona center-middle: espacio de reflexión + imagen fondo suave
    title:
      font: title
      size_override: 36     # Más grande para impacto — la pregunta es el protagonista
      align: center
      color: primary
    body:
      font: subtitle        # 26pt — para que la respuesta/contexto sea legible en aula
      align: center
      color: text
    background_overlay:
      opacity: 0.08         # Imagen muy suave detrás — no compite con el texto

  cierre:
    # Zona center-middle: frase clave o mensaje de cierre
    # Zona center-bottom: call-to-action o próximos pasos
    title:
      font: title
      size_override: 36
      align: center
      color: primary
    body:
      font: body
      align: center
      color: text
    accent_bar:
      color: accent
      position: bottom

  timeline:
    # Zona left-top-split: texto de contexto arriba izquierda
    # Zona right-half: tabla cronológica de eventos
    title:
      font: title
      align: left
      color: primary
    body:
      font: body
      align: left
      color: text
    table:
      header_background: primary
      header_text: "#FFFFFF"
      row_even: "#F0F4F8"
      row_odd: "#FFFFFF"
      border_color: "#B0C4D8"

  demo:
    # Zona left-middle: pasos numerados del demo
    # Zona right-half: bloque de código resultado
    title:
      font: title
      align: left
      color: primary
    body:
      font: body
      align: left
      color: text
    code_block:
      font: code
      background: "#F0F4F8"
      border_color: primary

# --- Tipos de filmina — Tabla canónica inmutable ---
# Esta tabla es la ÚNICA fuente de verdad para tipos, layouts e imagen.
# El script solo lee de aquí. Los agentes asignan tipos explícitos desde esta tabla.
slide_types:
  portada:
    layout: {title: full-title, body: center-bottom, image: background, code: none, table: none}
    image_layer: background
  concepto-abstracto:
    layout: {title: full-title, body: left-middle, image: right-half, code: none, table: none}
    image_layer: content
  concepto-mixto:
    layout: {title: full-title, body: left-middle, image: none, code: right-half, table: none}
    image_layer: none
    note: "Texto izquierda + código derecha. Añadido v2 post-Bug 1."
  tabla-mixta:
    layout: {title: full-title, body: left-top-split, image: none, code: left-bottom-split, table: right-half}
    image_layer: none
    note: "Texto/código a la izquierda y tabla a la derecha. Añadido para evitar pérdida de tablas en slides mixtas."
  codigo:
    layout: {title: full-title, body: subtitle-only, image: none, code: full-bottom, table: none}
    image_layer: none
  tabla:
    layout: {title: full-title, body: table-intro, image: none, code: none, table: table-main}
    image_layer: none
  tabla-comparativa:
    layout: {title: full-title, body: table-intro, image: none, code: none, table: table-main}
    image_layer: none
  diagrama:
    layout: {title: full-title, body: left-middle, image: right-half, code: none, table: none}
    image_layer: content
  socratica:
    layout: {title: center-top, body: center-middle, image: background, code: none, table: none}
    image_layer: background
  cierre:
    layout: {title: center-middle, body: center-bottom, image: background, code: none, table: none}
    image_layer: background
  timeline:
    layout: {title: full-title, body: left-top-split, image: none, code: none, table: right-half}
    image_layer: none
  demo:
    layout: {title: full-title, body: left-middle, image: none, code: right-half, table: none}
    image_layer: none

# --- Estrategia de imágenes (Gemini) ---
gemini_image_strategy:
  default: "content"
  max_per_presentation: 12
  max_images_per_presentation: 12  # alias de compatibilidad
  fallback: "none"
  safety_rules: "Sin texto, sin letras, sin código, sin etiquetas ni fórmulas. Solo elementos visuales: objetos, iconos, escenas o diagramas mudos. Estilo vectorial limpio, fondo claro, académico."
  prompt_guide: |
    REGLA: describir SOLO geometría (formas, colores, posiciones, tamaños).
    NUNCA nombrar conceptos técnicos — Gemini los convierte en etiquetas de texto.
    Template: [Elemento]: [forma] [color] [posición]. [Relación posicional]. [Estilo flat]. Sin texto, sin letras.

# --- Render semántico de Markdown en Google Slides ---
markdown_rendering:
  unordered_bullet_preset: "BULLET_DISC_CIRCLE_SQUARE"
  ordered_bullet_preset: "NUMBERED_DIGIT_ALPHA_ROMAN"
  inline_code_font: "Roboto Mono"
  inline_code_color: "#1B3A5C"
  lead_scale: 1.0
  heading_scale: 1.12
