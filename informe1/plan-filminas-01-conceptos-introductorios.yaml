- id: F-19
  type: tabla
  title: ''
  subtitle: Los 4 paradigmas fundamentales
  body_blocks:
  - type: text
    content: '> *"El OO es una extensión del imperativo — no nació de cero. El funcional
      y el lógico tienen raíces matemáticas pre-computadoras."*'
  - type: list
    ordered: false
    items:
    - content: '**Nota:** Los lenguajes *multiparadigma* (TypeScript, Python, Scala)
        combinan varios de estos — ver F-10.'
      level: 0
  code_blocks: []
  tables:
  - '| Paradigma | Base formal | Unidad | Estado | Ejemplos |

    |-----------|-------------|--------|--------|----------|

    | **Imperativo** | Máquina de Von Neumann | Instrucción | Mutable | C, Go, Pascal
    |

    | **OO** | Imperativo + encapsulamiento | Objeto / mensaje | Mutable (encapsulado)
    | Java, C#, Dart |

    | **Declarativo (Funcional)** | Cálculo lambda (Church, 1936) | Función | **Inmutable**
    | Haskell, Clojure, LISP |

    | **Declarativo (Lógico)** | Lógica simbólica (resolución) | Relación / hecho
    | Sin estado | Prolog |'
