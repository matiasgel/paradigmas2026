- id: F-34
  type: concepto-abstracto
  title: ''
  subtitle: La IA funciona mejor con TypeScript porque...
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: Los modelos se entrenan con enormes conjuntos de código (GitHub, StackOverflow,
        npm) donde TypeScript es abundante y consistente.
      level: 0
    - content: 'Las anotaciones de tipo reducen la ambigüedad semántica: el código
        es más fácil de inferir, corregir y completar.'
      level: 0
    - content: TypeScript fomenta prácticas robustas (tests, linting — revisa estilo
        código, formateo), lo que eleva la calidad del código de entrada al entrenar
        los modelos.
      level: 0
    - content: La salida de la IA es más fácil de **auditar** y **testear**, porque
        el compilador añade una barrera de verificación antes de ejecutar.
      level: 0
    - content: Como resultado, los prompts que piden código suelen generar TS más
        confiable que JavaScript dinámico.
      level: 0
