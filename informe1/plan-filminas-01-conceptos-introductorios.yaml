- id: F-03
  type: concepto-abstracto
  title: ''
  subtitle: Definición formal
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: '**Cómputo**'
      level: 0
    - content: '> Una serie de operaciones estructuradas aplicadas a un conjunto de
        datos de entrada para obtener nuevos datos como resultado.'
      level: 0
  - type: list
    ordered: false
    items:
    - content: '**Programa**'
      level: 0
    - content: '> Una colección definida y ordenada de cómputos diseñada para realizar
        una tarea específica o resolver un problema concreto.'
      level: 0
  - type: list
    ordered: false
    items:
    - content: '**Lenguaje de programación**'
      level: 0
    - content: '> Un conjunto de **reglas sintácticas y semánticas** usadas para definir
        programas. Sistema de notación cuyas instrucciones son comprendidas y ejecutadas
        por máquinas.'
      level: 0
  - type: list
    ordered: false
    items:
    - content: '*(Slides cátedra UNTDF 2024 · Aaby, A. — citado en Louden & Lambert,
        Cap. 1)*'
      level: 0
  - type: text
    content: '> Una descripción completa incluye el **modelo computacional**, la **sintaxis**,
      la **semántica** y las **consideraciones pragmáticas** que dan forma al lenguaje.'
