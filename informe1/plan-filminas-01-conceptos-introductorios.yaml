- id: F-39
  type: codigo
  title: ''
  subtitle: 'TypeScript: ¿qué paradigma usamos?'
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: '*Mismo problema — tres estilos válidos:*'
      level: 0
  - type: text
    content: '> **Los tres producen `14`. La elección es del programador.**

      > La elección de paradigma determina la legibilidad, testabilidad y mantenibilidad.

      > A lo largo de la materia: vamos a escribir y comparar los tres estilos.'
  code_blocks:
  - lang: typescript
    content: "const datos = [3, -1, 4, -1, 5];\n\n// ← imperativo: variable mutable\
      \ + loop\nlet acc = 0;\nfor (const x of datos) acc += Math.abs(x);\n\n// ← funcional:\
      \ sin estado, composición de funciones\nconst result = datos.map(Math.abs).reduce((a,\
      \ b) => a + b, 0);\n\n// ← OO: dato + comportamiento encapsulados\nclass Calculadora\
      \ {\n    sumaAbs(arr: number[]): number {\n        return arr.reduce((a, x)\
      \ => a + Math.abs(x), 0);\n    }\n}"
