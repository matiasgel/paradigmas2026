- id: F-06
  type: tabla
  title: ''
  subtitle: ¿Cómo evaluamos un lenguaje? — Sebesta (2018)
  body_blocks:
  - type: text
    content: Sebesta propone un conjunto de criterios para comparar lenguajes de programación
      de manera sistemática. Cada criterio aborda un aspecto distinto del uso real
      del lenguaje (lectura, escritura, seguridad, costo, portabilidad y eficiencia).
  - type: text
    content: '> No hay lenguaje perfecto — hay **trade-offs**.'
  code_blocks: []
  tables:
  - '| Criterio | Pregunta clave | Ejemplo de tensión |

    |----------|---------------|-------------------|

    | **Legibilidad** | ¿Se puede leer código ajeno? | Python vs. Perl |

    | **Expresividad** | ¿El lenguaje facilita la expresión? | SQL vs. ensamblador
    |

    | **Seguridad** | ¿Los tipos reducen bugs? | TypeScript vs. JS puro |

    | **Costo** | ¿Cuánto cuesta desarrollar y mantener? | — |

    | **Portabilidad** | ¿Funciona en distintas plataformas? | Java vs. C |

    | **Eficiencia** | ¿Qué tan rápido y cuánta memoria? | C vs. Python |'
