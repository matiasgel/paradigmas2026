  title: ''
  subtitle: TypeScript — estilo funcional
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: '**¿Qué cambió?**'
      level: 0
    - content: Sin `let` → sin mutación de estado
      level: 0
    - content: Sin loop explícito
      level: 0
    - content: '`map` y `reduce` son **funciones de orden superior** (reciben funciones
        como argumento)'
      level: 0
  - type: text
    content: '> En Scheme (LISP, 1960): `(reduce + (map abs lista))`

