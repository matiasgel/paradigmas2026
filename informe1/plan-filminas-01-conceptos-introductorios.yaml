- id: F-17
  type: concepto-abstracto
  title: ''
  subtitle: El modelo impone restricciones a los lenguajes "pegados" a la máquina
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: 'Lenguajes imperativos modelan explícitamente este flujo: variables
        = celdas, asignación = transferencia.'
      level: 0
    - content: Eso traslada la complejidad del acceso a memoria al diseño del lenguaje.
      level: 0
    - content: El estado mutable y la ejecución secuencial se vuelven “naturales”,
        pero limitantes.
      level: 0
  - type: text
    content: '> **Directive:** generar diagrama de flujo: variable → memoria → asignación
      → estado.'
