- id: F-15
  type: concepto-abstracto
  title: ''
  subtitle: La máquina de Von Neumann (modelo conceptual)
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: '**Elementos clave:**'
      level: 0
    - content: '**Memoria unificada:** los datos y el programa conviven en el mismo
        espacio.'
      level: 0
    - content: '**Unidad de control:** lee (fetch) una instrucción, la decodifica
        y la ejecuta.'
      level: 0
    - content: '**ALU** (unidad aritmético-lógica) + registros temporales en CPU.'
      level: 0
    - content: '**Bus de datos** común entre CPU y memoria.'
      level: 0
  - type: list
    ordered: false
    items:
    - content: '**Implicaciones para los lenguajes:**'
      level: 0
    - content: Una **variable** es una celda de memoria.
      level: 0
    - content: La **asignación** es una transferencia de datos CPU ↔ memoria.
      level: 0
    - content: 'La ejecución es **secuencial**: cada instrucción se ejecuta en orden.'
      level: 0
  - type: text
    content: '> **Directive:** generar gráfico de la máquina Von Neumann (CPU, memoria,
      bus).'
