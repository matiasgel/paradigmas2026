- id: F-23
  type: codigo
  title: ''
  subtitle: 'Suma de valores absolutos: LC-3 vs. C'
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: '**Ensamblador LC-3** (13 líneas, opaco):'
      level: 0
  - type: list
    ordered: false
    items:
    - content: '**C — imperativo de alto nivel** (5 líneas, legible):'
      level: 0
  - type: list
    ordered: false
    items:
    - content: '*(¿Qué haría TypeScript diferente? → Bloque 4)*'
      level: 0
  code_blocks:
  - lang: text
    content: "        AND R0, R0, #0    ; acc = 0\n        LEA R1, DATA      ; puntero\
      \ al inicio del array\n        AND R2, R2, #0\n        ADD R2, R2, #10   ; contador\
      \ = 10\nLOOP    LDR R3, R1, #0    ; cargar elemento\n        BRzp POS      \
      \    ; si >= 0, saltar\n        NOT R3, R3        ; negar (complemento a 2)\n\
      \        ADD R3, R3, #1\nPOS     ADD R0, R0, R3    ; acc += abs\n        ADD\
      \ R1, R1, #1    ; avanzar puntero\n        ADD R2, R2, #-1   ; contador--\n\
      \        BRp LOOP          ; repetir si queda"
  - lang: c
    content: "int suma_abs(int arr[], int n) {\n    int acc = 0;\n    for (int i =\
      \ 0; i < n; i++)\n        acc += (arr[i] < 0) ? -arr[i] : arr[i];\n    return\
      \ acc;\n}"
