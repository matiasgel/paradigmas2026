- id: F-18
  type: concepto-abstracto
  title: ''
  subtitle: El cuello de botella empuja hacia otros modelos de cómputo
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: El paradigma imperativo lucha con paralelismo y efectos secundarios.
      level: 0
    - content: Paradigmas alternativos proponen reducir la dependencia de la memoria
        compartida.
      level: 0
  - type: list
    ordered: false
    items:
    - content: '**Ejemplos contemporáneos:**'
      level: 0
    - content: '**Funcional (declarativo):** lenguajes como Haskell o Clojure adoptan
        un modelo donde el cómputo es una evaluación de expresiones, minimizando el
        estado mutable. Describe *qué* se quiere calcular en lugar de *cómo* hacerlo.'
      level: 0
    - content: '**Lógico (declarativo):** lenguajes como Prolog usan un modelo de
        resolución basada en hechos y reglas, reduciendo la dependencia de memoria
        compartida. Describe relaciones y deja que el motor inferencial determine
        el cómo.'
      level: 0
  - type: text
    content: '> **Directive:** generar gráfico comparativo (imperativo vs. funcional
      vs. lógico) en relación al acceso a memoria.'
