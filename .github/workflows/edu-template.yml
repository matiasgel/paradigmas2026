name: 📦 EDU Template — Rama limpia portátil

on:
  push:
    branches:
      - main
    paths:
      - 'salida/edu-standalone/.github/agents/**'
      - 'salida/edu-standalone/.github/prompts/**'
      - 'salida/edu-standalone/.github/copilot-instructions.md'
      - 'salida/edu-standalone/_edu/agents/**'
      - 'salida/edu-standalone/_edu/workflows/**'
      - 'salida/edu-standalone/_edu/tasks/**'
      - 'salida/edu-standalone/_edu/templates/**'
      - 'salida/edu-standalone/_edu/schemas/**'
      - 'salida/edu-standalone/_edu/module-help.csv'
      - 'salida/edu-standalone/_edu/config.yaml'
      - 'salida/edu-standalone/README.md'
      - 'salida/edu-standalone/WORKFLOW_PROMPT_MAP.md'
      - 'salida/edu-standalone/requirements.txt'
  workflow_dispatch:
    inputs:
      confirm:
        description: '¿Publicar rama edu-template (solo agentes, prompts y docs)? Escribí "si" para confirmar'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'si' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo
          fetch-depth: 0

      - name: Checkout edu-template (si existe)
        id: checkout-template
        uses: actions/checkout@v4
        with:
          ref: edu-template
          path: template-repo
          fetch-depth: 0
        continue-on-error: true

      - name: Crear rama edu-template si no existe
        if: steps.checkout-template.outcome == 'failure'
        run: |
          cd main-repo
          git checkout -b "edu-template"
          git push origin "edu-template"
          cd ..
          git clone --branch "edu-template" "$(git -C main-repo remote get-url origin)" template-repo

      - name: Configurar git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Limpiar rama edu-template (solo mantener .git)
        run: |
          find template-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          echo "✅ Rama edu-template limpiada"

      - name: Sync — .github/agents/ (solo edu-*.agent.md)
        run: |
          mkdir -p template-repo/.github/agents
          rsync -av \
            --include='edu-*.agent.md' \
            --exclude='*' \
            main-repo/salida/edu-standalone/.github/agents/ \
            template-repo/.github/agents/
          echo "✅ .github/agents sincronizado"

      - name: Sync — .github/prompts/ (solo edu-*.prompt.md)
        run: |
          mkdir -p template-repo/.github/prompts
          rsync -av \
            --include='edu-*.prompt.md' \
            --exclude='*' \
            main-repo/salida/edu-standalone/.github/prompts/ \
            template-repo/.github/prompts/
          echo "✅ .github/prompts sincronizado"

      - name: Sync — _edu/agents/
        run: |
          mkdir -p template-repo/_edu/agents
          rsync -av --delete \
            main-repo/salida/edu-standalone/_edu/agents/ \
            template-repo/_edu/agents/
          echo "✅ _edu/agents sincronizado"

      - name: Sync — _edu/workflows/
        run: |
          mkdir -p template-repo/_edu/workflows
          rsync -av --delete \
            main-repo/salida/edu-standalone/_edu/workflows/ \
            template-repo/_edu/workflows/
          echo "✅ _edu/workflows sincronizado"

      - name: Sync — _edu/tasks/
        run: |
          mkdir -p template-repo/_edu/tasks
          rsync -av --delete \
            main-repo/salida/edu-standalone/_edu/tasks/ \
            template-repo/_edu/tasks/
          echo "✅ _edu/tasks sincronizado"

      - name: Sync — _edu/templates/
        run: |
          mkdir -p template-repo/_edu/templates
          rsync -av --delete \
            main-repo/salida/edu-standalone/_edu/templates/ \
            template-repo/_edu/templates/
          echo "✅ _edu/templates sincronizado"

      - name: Sync — _edu/schemas/
        run: |
          mkdir -p template-repo/_edu/schemas
          rsync -av --delete \
            main-repo/salida/edu-standalone/_edu/schemas/ \
            template-repo/_edu/schemas/
          echo "✅ _edu/schemas sincronizado"

      - name: Sync — _edu/ archivos sueltos (module-help + config template)
        run: |
          [ -f main-repo/salida/edu-standalone/_edu/module-help.csv ] && \
            cp main-repo/salida/edu-standalone/_edu/module-help.csv template-repo/_edu/
          # config.yaml: solo copiar si no fue personalizado (es un template de primer uso)
          if [ ! -f template-repo/_edu/config.yaml ]; then
            cp main-repo/salida/edu-standalone/_edu/config.yaml template-repo/_edu/config.yaml
            echo "✅ _edu/config.yaml copiado (template inicial)"
          else
            echo "⏭️  _edu/config.yaml preservado (ya fue personalizado en destino)"
          fi

      - name: Sync — Archivos raíz (docs, deps, dotfiles)
        run: |
          cp main-repo/salida/edu-standalone/README.md             template-repo/
          cp main-repo/salida/edu-standalone/WORKFLOW_PROMPT_MAP.md template-repo/
          cp main-repo/salida/edu-standalone/.gitignore             template-repo/
          cp main-repo/salida/edu-standalone/requirements.txt       template-repo/
          [ -f main-repo/salida/edu-standalone/.env.example ] && \
            cp main-repo/salida/edu-standalone/.env.example template-repo/
          echo "✅ Archivos raíz sincronizados"

      - name: Reconstruir .github/copilot-instructions.md
        run: |
          mkdir -p template-repo/.github
          # Iniciar con el bloque base del copilot-instructions.md del main (sin bloque EDU)
          if [ -f main-repo/.github/copilot-instructions.md ]; then
            cp main-repo/.github/copilot-instructions.md template-repo/.github/copilot-instructions.md
            # Eliminar cualquier bloque <!-- EDU:START --> ... <!-- EDU:END --> que ya tenga
            perl -i -0pe 's/<!-- EDU:START -->.*?<!-- EDU:END -->\n?//gs' \
              template-repo/.github/copilot-instructions.md
          else
            touch template-repo/.github/copilot-instructions.md
          fi
          # Agregar el bloque EDU de edu-standalone al final
          if [ -f main-repo/salida/edu-standalone/.github/copilot-instructions.md ]; then
            echo "" >> template-repo/.github/copilot-instructions.md
            cat main-repo/salida/edu-standalone/.github/copilot-instructions.md \
              >> template-repo/.github/copilot-instructions.md
          fi
          echo "✅ copilot-instructions.md reconstruido"

      - name: Commit y push
        run: |
          cd template-repo
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios — rama edu-template ya está al día."
            exit 0
          fi
          DEPLOY_DATE=$(date +"%Y-%m-%d %H:%M UTC")
          git commit -m "edu-template: sync agentes/prompts/docs [$DEPLOY_DATE]"
          git push origin edu-template
          echo "✅ edu-template actualizada"

      - name: Reporte final
        run: |
          echo "=== RAMA edu-template ACTUALIZADA ==="
          echo ""
          echo "  .github/agents (edu-*.agent.md):"
          ls template-repo/.github/agents/edu-*.agent.md 2>/dev/null | wc -l | xargs echo "    archivos:"
          echo "  .github/prompts (edu-*.prompt.md):"
          ls template-repo/.github/prompts/edu-*.prompt.md 2>/dev/null | wc -l | xargs echo "    archivos:"
          echo "  _edu/agents:"
          ls template-repo/_edu/agents/ 2>/dev/null | wc -l | xargs echo "    archivos:"
          echo "  _edu/workflows:"
          ls template-repo/_edu/workflows/ 2>/dev/null | wc -l | xargs echo "    carpetas:"
          echo "  _edu/tasks:"
          ls template-repo/_edu/tasks/ 2>/dev/null | wc -l | xargs echo "    archivos:"
          echo "  _edu/templates:"
          ls template-repo/_edu/templates/ 2>/dev/null | wc -l | xargs echo "    archivos:"
          echo "  _edu/schemas:"
          ls template-repo/_edu/schemas/ 2>/dev/null | wc -l | xargs echo "    archivos:"
          echo ""
          echo "  README.md:            $([ -f template-repo/README.md ] && echo presente || echo FALTA)"
          echo "  WORKFLOW_PROMPT_MAP:  $([ -f template-repo/WORKFLOW_PROMPT_MAP.md ] && echo presente || echo FALTA)"
          echo "  requirements.txt:     $([ -f template-repo/requirements.txt ] && echo presente || echo FALTA)"
          echo "  _edu/config.yaml:     $([ -f template-repo/_edu/config.yaml ] && echo presente || echo FALTA)"
          echo ""
          echo "  ✅ Sin scripts/  ✅ Sin app_adaptive.py  ✅ Sin edu-mcp-server/"
          echo "  ✅ Sin _edu-knowledge/  ✅ Sin .vscode/  ✅ Sin salida/cursadas/"

  cancelled:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'si' }}
    steps:
      - name: Deploy cancelado
        run: echo "Deploy cancelado — escribí 'si' para confirmar."
