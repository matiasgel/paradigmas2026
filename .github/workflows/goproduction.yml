name: 🚀 Go to Production

on:
  push:
    branches:
      - main
    paths:
      - 'salida/edu-standalone/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: '¿Deployar edu-standalone → ramas production, lenguajes y lenguajes2026? Escribí "si" para confirmar'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'si' }}
    strategy:
      matrix:
        target_branch: [production, lenguajes, lenguajes2026]

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo
          fetch-depth: 0

      - name: Checkout ${{ matrix.target_branch }}
        id: checkout-target
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target_branch }}
          path: target-repo
          fetch-depth: 0
        continue-on-error: true

      - name: Crear rama ${{ matrix.target_branch }} si no existe
        if: steps.checkout-target.outcome == 'failure'
        run: |
          cd main-repo
          git checkout -b "${{ matrix.target_branch }}"
          git push origin "${{ matrix.target_branch }}"
          cd ..
          git clone --branch "${{ matrix.target_branch }}" "$(git -C main-repo remote get-url origin)" target-repo

      - name: Configurar git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: "4.0.5 - Sync .github/workflows y copilot-instructions desde main"
        run: |
          # Sync workflows y copilot-instructions - NO prompts (los maneja el paso 4.6), NO agents/ (solo edu-* van ahi)
          rsync -av --delete main-repo/.github/workflows/ target-repo/.github/workflows/
          cp main-repo/.github/copilot-instructions.md target-repo/.github/copilot-instructions.md 2>/dev/null || true
          # Limpiar agentes BMAD que pudieran haber quedado
          rm -f target-repo/.github/agents/bmad-*.agent.md
          echo "OK .github/workflows/ y copilot-instructions sincronizados desde main (prompts y agents/ gestionados por pasos 4.6 y 4.5)"

      - name: "4.1 — Deploy _edu/agents/"
        run: |
          rm -rf target-repo/_edu/agents
          mkdir -p target-repo/_edu
          cp -r main-repo/salida/edu-standalone/_edu/agents target-repo/_edu/agents
          echo "✅ _edu/agents/ → $(ls target-repo/_edu/agents/ | wc -l) archivos"

      - name: "4.2 — Deploy _edu/workflows/"
        run: |
          rm -rf target-repo/_edu/workflows
          cp -r main-repo/salida/edu-standalone/_edu/workflows target-repo/_edu/workflows
          echo "✅ _edu/workflows/ → $(ls target-repo/_edu/workflows/ | wc -l) carpetas"

      - name: "4.3 — Deploy _edu/module-help.csv"
        run: |
          cp main-repo/salida/edu-standalone/_edu/module-help.csv target-repo/_edu/module-help.csv
          echo "✅ _edu/module-help.csv actualizado"

      - name: "4.4 — Deploy _edu/config.yaml (solo primer deploy)"
        run: |
          if [ ! -f target-repo/_edu/config.yaml ]; then
            cp main-repo/salida/edu-standalone/_edu/config.yaml target-repo/_edu/config.yaml
            echo "✅ _edu/config.yaml copiado del standalone (primer deploy)"
          else
            echo "⏭️  _edu/config.yaml PRESERVADO — ya estaba configurado"
          fi

      - name: "4.5 — Deploy .github/agents/edu-*"
        run: |
          mkdir -p target-repo/.github/agents
          rm -f target-repo/.github/agents/edu-*.md
          cp main-repo/salida/edu-standalone/.github/agents/edu-*.agent.md target-repo/.github/agents/
          echo "✅ .github/agents/ edu-* → $(ls target-repo/.github/agents/edu-*.agent.md | wc -l) archivos"

      - name: "4.6 - Deploy .github/prompts/edu-* (solo edu, sin BMAD)"
        run: |
          mkdir -p target-repo/.github/prompts
          # Borrar TODOS los prompts existentes (BMAD y cualquier otro) antes de copiar solo los edu-*
          rm -f target-repo/.github/prompts/*.prompt.md
          cp main-repo/salida/edu-standalone/.github/prompts/edu-*.prompt.md target-repo/.github/prompts/
          echo "OK .github/prompts/ - solo edu-* -> $(ls target-repo/.github/prompts/edu-*.prompt.md | wc -l) archivos (prompts BMAD excluidos)"

      - name: "4.7 — Actualizar bloque EDU en copilot-instructions.md"
        run: |
          sed -i '/<!-- EDU:START -->/,/<!-- EDU:END -->/d' target-repo/.github/copilot-instructions.md || true
          echo "" >> target-repo/.github/copilot-instructions.md
          cat main-repo/salida/edu-standalone/.github/copilot-instructions.md >> target-repo/.github/copilot-instructions.md
          echo "✅ copilot-instructions.md — bloque EDU actualizado"

      - name: "4.8.1 — Deploy scripts/ (pipeline, setup, goproduction)"
        run: |
          rm -rf target-repo/scripts
          cp -r main-repo/salida/edu-standalone/scripts target-repo/scripts
          echo "✅ scripts/ → $(ls target-repo/scripts/ | grep -v __pycache__ | wc -l) archivos"

      - name: "4.8.2 — Deploy requirements.txt y README.md"
        run: |
          cp main-repo/salida/edu-standalone/requirements.txt target-repo/requirements.txt
          cp main-repo/salida/edu-standalone/README.md target-repo/README.md
          echo "✅ requirements.txt y README.md actualizados"

      - name: "4.8.3 — Deploy .env.example (solo si no existe .env real)"
        run: |
          cp main-repo/salida/edu-standalone/.env.example target-repo/.env.example
          if [ ! -f target-repo/.env ]; then
            cp main-repo/salida/edu-standalone/.env.example target-repo/.env
            echo "✅ .env.example copiado y .env generado (primer deploy)"
          else
            echo "⏭️  .env PRESERVADO — ya estaba configurado"
          fi

      - name: "4.9 — Commit y push a ${{ matrix.target_branch }}"
        run: |
          cd target-repo
          git add -A
          DEPLOY_DATE=$(date +"%Y-%m-%d %H:%M UTC")
          git commit -m "deploy: edu-standalone → ${{ matrix.target_branch }} [$DEPLOY_DATE]" --allow-empty
          git push origin "${{ matrix.target_branch }}"
          echo "✅ Deploy completado en ${{ matrix.target_branch }}:"
          git log --oneline -1

      - name: Reporte final
        run: |
          echo "=== DEPLOY COMPLETADO ==="
          echo "  Rama destino:          ${{ matrix.target_branch }}"
          echo "  _edu/agents/:          $(ls target-repo/_edu/agents/ | wc -l) archivos"
          echo "  _edu/workflows/:       $(ls target-repo/_edu/workflows/ | wc -l) carpetas"
          echo "  .github/agents edu-*:  $(ls target-repo/.github/agents/edu-*.agent.md | wc -l) archivos"
          echo "  .github/prompts edu-*: $(ls target-repo/.github/prompts/edu-*.prompt.md | wc -l) archivos"
          echo "  scripts/:              $(ls target-repo/scripts/ | grep -v __pycache__ | wc -l) archivos"
          echo "  requirements.txt:      $([ -f target-repo/requirements.txt ] && echo presente || echo FALTA)"
          echo "  README.md:             $([ -f target-repo/README.md ] && echo presente || echo FALTA)"
          echo ""
          echo "=== PRESERVACIÓN VALIDADA ==="
          [ -d target-repo/_edu-memory ]       && echo "  ✅ _edu-memory/" || echo "  ℹ️  _edu-memory/ (se crea en runtime)"
          [ -d target-repo/salida/cursadas ]   && echo "  ✅ salida/cursadas/" || echo "  ℹ️  salida/cursadas/ (se crea al usar el módulo)"
          [ -f target-repo/_edu/config.yaml ]  && echo "  ✅ _edu/config.yaml presente"
          [ -f target-repo/.env ]              && echo "  ✅ .env presente (preservado)" || echo "  ℹ️  .env no encontrado"

  cancelled:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm != 'si' }}
    steps:
      - name: Deploy cancelado
        run: echo "Deploy cancelado — escribí 'si' para confirmar."
