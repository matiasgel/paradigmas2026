name: 🚀 Go to Production

on:
  push:
    branches:
      - main
    paths:
      - 'salida/edu-standalone/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: '¿Deployar edu-standalone → ramas production, lenguajes y lenguajes2026? Escribí "si" para confirmar'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'si' }}
    strategy:
      matrix:
        target_branch: [production, lenguajes, lenguajes2026]

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo
          fetch-depth: 0

      - name: Checkout ${{ matrix.target_branch }}
        id: checkout-target
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target_branch }}
          path: target-repo
          fetch-depth: 0
        continue-on-error: true

      - name: Crear rama ${{ matrix.target_branch }} si no existe
        if: steps.checkout-target.outcome == 'failure'
        run: |
          cd main-repo
          git checkout -b "${{ matrix.target_branch }}"
          git push origin "${{ matrix.target_branch }}"
          cd ..
          git clone --branch "${{ matrix.target_branch }}" "$(git -C main-repo remote get-url origin)" target-repo

      - name: Configurar git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: "4.0 — Limpiar rama destino preservando runtime"
        run: |
          preserve_dir="$(mktemp -d)"
          mkdir -p "$preserve_dir/_edu"

          if [ -f target-repo/_edu/config.yaml ]; then
            mv target-repo/_edu/config.yaml "$preserve_dir/_edu/config.yaml"
          fi

          if [ -f target-repo/_edu/active-topic.yaml ]; then
            mv target-repo/_edu/active-topic.yaml "$preserve_dir/_edu/active-topic.yaml"
          fi

          if [ -f target-repo/.env ]; then
            mv target-repo/.env "$preserve_dir/.env"
          fi

          if [ -d target-repo/_edu-memory ]; then
            mv target-repo/_edu-memory "$preserve_dir/_edu-memory"
          fi

          if [ -d target-repo/salida ]; then
            mv target-repo/salida "$preserve_dir/salida"
          fi

          if [ -d target-repo/material ]; then
            mv target-repo/material "$preserve_dir/material"
          fi

          if [ -d target-repo/docs ]; then
            mv target-repo/docs "$preserve_dir/docs"
          fi

          find target-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          if [ -f "$preserve_dir/_edu/config.yaml" ]; then
            mkdir -p target-repo/_edu
            mv "$preserve_dir/_edu/config.yaml" target-repo/_edu/config.yaml
          fi

          if [ -f "$preserve_dir/_edu/active-topic.yaml" ]; then
            mkdir -p target-repo/_edu
            mv "$preserve_dir/_edu/active-topic.yaml" target-repo/_edu/active-topic.yaml
          fi

          if [ -f "$preserve_dir/.env" ]; then
            mv "$preserve_dir/.env" target-repo/.env
          fi

          if [ -d "$preserve_dir/_edu-memory" ]; then
            mv "$preserve_dir/_edu-memory" target-repo/_edu-memory
          fi

          if [ -d "$preserve_dir/salida" ]; then
            mv "$preserve_dir/salida" target-repo/salida
          fi

          if [ -d "$preserve_dir/material" ]; then
            mv "$preserve_dir/material" target-repo/material
          fi

          if [ -d "$preserve_dir/docs" ]; then
            mv "$preserve_dir/docs" target-repo/docs
          fi

          rm -rf "$preserve_dir"
          echo "✅ Rama destino limpiada; estado preservado (_edu/config.yaml, _edu/active-topic.yaml, .env, _edu-memory, salida/, material/, docs/)"

      - name: "4.0.5 — Sync root de edu-standalone"
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='_edu/config.yaml' \
            --exclude='_edu/active-topic.yaml' \
            --exclude='.env' \
            --exclude='_edu-memory/' \
            --exclude='salida/' \
            --exclude='material/' \
            --exclude='docs/' \
            --exclude='.github/copilot-instructions.md' \
            main-repo/salida/edu-standalone/ target-repo/
          echo "✅ Root standalone sincronizado en ${{ matrix.target_branch }}"

      - name: "4.0.6 — Sync .github/workflows desde main"
        run: |
          mkdir -p target-repo/.github
          rsync -av --delete main-repo/.github/workflows/ target-repo/.github/workflows/
          echo "✅ .github/workflows sincronizado desde main"

      - name: "4.0.7 — Reconstruir copilot-instructions.md"
        run: |
          cp main-repo/.github/copilot-instructions.md target-repo/.github/copilot-instructions.md 2>/dev/null || true
          sed -i '/<!-- EDU:START -->/,/<!-- EDU:END -->/d' target-repo/.github/copilot-instructions.md || true
          echo "" >> target-repo/.github/copilot-instructions.md
          cat main-repo/salida/edu-standalone/.github/copilot-instructions.md >> target-repo/.github/copilot-instructions.md
          echo "✅ copilot-instructions.md reconstruido con base main + bloque EDU"

      - name: "4.0.8 — Garantizar .env inicial"
        run: |
          if [ ! -f target-repo/.env ] && [ -f target-repo/.env.example ]; then
            cp target-repo/.env.example target-repo/.env
            echo "✅ .env generado desde .env.example (primer deploy)"
          else
            echo "⏭️  .env PRESERVADO — ya estaba configurado"
          fi

      - name: "4.9 — Commit y push a ${{ matrix.target_branch }}"
        run: |
          cd target-repo
          git add -A
          DEPLOY_DATE=$(date +"%Y-%m-%d %H:%M UTC")
          git commit -m "deploy: edu-standalone → ${{ matrix.target_branch }} [$DEPLOY_DATE]" --allow-empty
          git push origin "${{ matrix.target_branch }}"
          echo "✅ Deploy completado en ${{ matrix.target_branch }}:"
          git log --oneline -1

      - name: Reporte final
        run: |
          echo "=== DEPLOY COMPLETADO ==="
          echo "  Rama destino:          ${{ matrix.target_branch }}"
          echo "  _edu/agents/:          $(ls target-repo/_edu/agents/ | wc -l) archivos"
          echo "  _edu/workflows/:       $(ls target-repo/_edu/workflows/ | wc -l) carpetas"
          echo "  .github/agents edu-*:  $(ls target-repo/.github/agents/edu-*.agent.md | wc -l) archivos"
          echo "  .github/prompts edu-*: $(ls target-repo/.github/prompts/edu-*.prompt.md | wc -l) archivos"
          echo "  scripts/:              $(ls target-repo/scripts/ | grep -v __pycache__ | wc -l) archivos"
          echo "  requirements.txt:      $([ -f target-repo/requirements.txt ] && echo presente || echo FALTA)"
          echo "  README.md:             $([ -f target-repo/README.md ] && echo presente || echo FALTA)"
          echo ""
          echo "=== PRESERVACIÓN VALIDADA ==="
          [ -d target-repo/_edu-memory ]       && echo "  ✅ _edu-memory/" || echo "  ℹ️  _edu-memory/ (se crea en runtime)"
          [ -d target-repo/salida ]            && echo "  ✅ salida/ preservada" || echo "  ℹ️  salida/ no encontrada"
          [ -d target-repo/material ]          && echo "  ✅ material/ preservada" || echo "  ℹ️  material/ no encontrada"
          [ -d target-repo/docs ]              && echo "  ✅ docs/ preservada" || echo "  ℹ️  docs/ no encontrada"
          [ -f target-repo/_edu/config.yaml ]  && echo "  ✅ _edu/config.yaml presente"
          [ -f target-repo/_edu/active-topic.yaml ] && echo "  ✅ _edu/active-topic.yaml preservado" || echo "  ℹ️  _edu/active-topic.yaml no encontrado"
          [ -f target-repo/.env ]              && echo "  ✅ .env presente (preservado)" || echo "  ℹ️  .env no encontrado"

  cancelled:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm != 'si' }}
    steps:
      - name: Deploy cancelado
        run: echo "Deploy cancelado — escribí 'si' para confirmar."
