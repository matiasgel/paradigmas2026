# NOTA: Este archivo NUNCA se resetea — acumula calibración año a año

tema:
  numero: "04"
  nombre: "Aspectos Avanzados de Programación Funcional"
  duracion_clase: 120
  bloques: 4
  artefactos_evaluados:
    - diseno.md
    - minuta.md
    - filminas.md
    - guia-estudio.md
    - tp.md

literatura:
  - id: "mahatanankoon-wolf-2021"
    titulo: "Cognitive Learning Strategies in an Introductory Computer Programming Course"
    autores: ["Mahatanankoon, P.", "Wolf, J."]
    año: 2021
    fuente: "ISEJ"
    eric_id: "EJ1301236"
    relevancia: >
      Estrategias deep vs shallow. Estratégico comprende ADT conceptualmente;
      recursero memoriza pattern matching sin internalizar por qué.

  - id: "olipas-2022"
    titulo: "Feelings, Challenges and Difficulties Experienced by IT Students in Learning Computer Programming"
    autores: ["Olipas, C. N."]
    año: 2022
    fuente: "ERIC"
    eric_id: "ED622663"
    relevancia: >
      Ansiedad ante notación nueva. En Tema 04: sintaxis Clojure (paréntesis,
      macros, go blocks) y tipos algebraicos generan activación del ansioso.

  - id: "sweller-chen-2023"
    titulo: "Cognitive Load Theory — Revised"
    autores: ["Sweller, J.", "Chen, O."]
    año: 2023
    relevancia: >
      Bloque 3 (concurrencia: canales + STM + agentes + async/await en 30 min)
      excede la carga cognitiva recomendable para disperso y ansioso.
      Segmentación (Mayer) es crítica.

  - id: "hoq-et-al-2025"
    titulo: "Automated Identification of Logical Errors — Student Misconceptions"
    autores: ["Hoq, M.", "et al."]
    año: 2025
    fuente: "IEDMS"
    eric_id: "ED675600"
    relevancia: >
      Misconception "const = inmutable" persiste en ~35% de alumnos incluso
      después del Tema 03. Requiere intervención directa en F-05.

