    perfiles_que_se_reactivan: [disperso, recursero]
    oportunidad: "Usar como gancho para retomar conceptos de gramáticas formales"

  faq_anticipado:
    - perfil: ansioso
      pregunta: "¿Tengo que memorizar la notación BNF para el parcial?"
      respuesta_sugerida: "No memorizar — entender qué expresa cada producción."
    - perfil: disperso
      pregunta: "¿Esto entra en el examen?"
      respuesta_sugerida: "Sí — derivación y árboles de análisis son evaluados."
    - perfil: estrategico
      pregunta: "¿TypeScript usa EBNF internamente?"
      respuesta_sugerida: "Sí — el spec de TypeScript define su sintaxis en EBNF."
    - perfil: recursero
      pregunta: "¿Hay ejercicios resueltos de derivación?"
