      score_global: 65
    bloque_mas_bajo: "B3_backtracking (48) y B4_corte (42)"
    zona_recuperacion: "guia-estudio.md sube +16 pts respecto a clase"
    misconceptions_probables:
      - "occurs-check es algo que siempre hay que activar"
      - "=.. es un operador raro que no se usa"
      - "findall siempre falla si no hay resultados (es bagof)"
      - "\+ P significa P es falso (en lógica clásica)"
    alertas:
      - "Bloque 3+4 consecutivos = sobrecarga cognitiva"
      - "Pausa socrática en min 80 no es opcional"
      - "Caja 'para la práctica no te preocupes' en occurs-check"
      - "Tabla findall/bagof/setof con misma consulta lado a lado"

  disperso:
    scores_tema07:
      en_clase: 42
      guia_autonoma: 51
      tp_estimado: "38-52/100"
      score_global: 46
    bloque_mas_bajo: "B3_backtracking (28), B9_acumulador (24), B11_aplicaciones (15)"
    prerequisito_gap:
      - "Recursión no consolidada desde Tema 01"
      - "Patrón base/recursivo sólo memorizado"
      - "No distingue 'goal' vs 'cláusula' vs 'resolvente'"
    misconceptions_probables:
      - "! = return de Python"
      - "findall devuelve una sola solución"
      - "Acumulador = variable global"
      - "Prolog es como SQL"
    alertas:
      - "Abandona durante B4 (~min 95)"
      - "TP: falla ej17+ (acumulador) y ej23-28 (grafos/CSP/reinas)"
      - "Necesita mapa mental visual al inicio de B3 y B9"
      - "Demo 'cuándo backtrackea' con animación lenta"
      - "Analogía mochila para acumulador OBLIGATORIA"

  recursero:
    scores_tema07:
      en_clase: 60
      guia_autonoma: 66
      tp_estimado: "60-72/100"
      score_global: 63
    bloque_mas_bajo: "B4_corte (50), B9_acumulador (55)"
    zona_comodidad: "B8 listas manuales (member/append/length) desde Tema 06"
    misconceptions_probables:
      - "! = return"
      - "Acumulador es una variable global"
      - "Orden de cláusulas no afecta semántica (solo performance)"
      - "findall y bagof son equivalentes"
    alertas:
      - "Aprueba ej01-ej16 por memorización de patrones"
      - "ej17/ej19 (acumulador) sin comprensión real"
      - "ej26/27/28 (integradores) son el filtro deep vs shallow"
      - "Pregunta detectora min 190: 'contar 1 a N con acumulador' — va a decrementar"

predicciones_clase:
