    - guiaprofesor.md

literatura:
  - id: "sweller-chen-2023"
    titulo: "Cognitive Load Theory — Revised"
    autores: ["Sweller, J.", "Chen, O."]
    año: 2023
    relevancia: >
      Clase de 240 min con B3+B4 consecutivos (50 min de backtracking + corte sin
      ejercicio activo) excede la carga cognitiva recomendada para ansioso/disperso.
      Segmentación (Mayer) crítica: pausa socrática obligatoria en min 80.

  - id: "olipas-2022"
    titulo: "Feelings, Challenges and Difficulties Experienced by IT Students in Learning Computer Programming"
    autores: ["Olipas, C. N."]
    año: 2022
    fuente: "ERIC"
    eric_id: "ED622663"
    relevancia: >
      Notación impenetrable para ansioso: =.. (univ), occurs-check, dif/2 vs \+.
      Acumulador doble-parámetro genera activación por "no saber dónde poner qué".

  - id: "mahatanankoon-wolf-2021"
    titulo: "Cognitive Learning Strategies in an Introductory Computer Programming Course"
    autores: ["Mahatanankoon, P.", "Wolf, J."]
    año: 2021
    fuente: "ISEJ"
    eric_id: "EJ1301236"
    relevancia: >
      Deep vs shallow. Recursero aprueba member/append/reverse sin captar
      declaratividad. Filtro: ej26/27/28 del TP detectan memorización vs comprensión.

  - id: "hoq-et-al-2025"
    titulo: "Automated Identification of Logical Errors — Student Misconceptions"
    autores: ["Hoq, M.", "et al."]
    año: 2025
    fuente: "IEDMS"
    eric_id: "ED675600"
    relevancia: >
      Misconceptions documentadas en lógica: "! = return", "=  es asignación",
      "\+ P = P es falso". Persisten en 30-50% del cohort sin intervención directa.

  - id: "mayer-2023"
    titulo: "Multimedia Learning (3rd ed.)"
    autores: ["Mayer, R. E."]
    año: 2023
    relevancia: >
      Principio de segmentación: contenido abstracto (SLD, acumulador) debe
      presentarse en segmentos ≤5 min con checkpoint intermedio. B11 (15 min)
      con CSP + 4-reinas viola este principio.

