      score_cohort_promedio: 55
      intervencion_sugerida: >
        Pausa socrática OBLIGATORIA en min 80. Pregunta abierta:
        "¿dónde backtrackea Prolog ahora?" — 2 min de discusión.

    - tema: "Bloque 9 — Recursión con acumulador"
      perfiles_en_riesgo: [disperso, recursero]
      score_cohort_promedio: 54
      intervencion_sugerida: >
        Analogía mochila + traza pizarrón para factorial/2 → factorial/3.
        Pregunta detectora: contar 1 a N.

    - tema: "Bloque 11 — Aplicaciones: CSP + 4-reinas en 15 min"
      perfiles_en_riesgo: [todos]
      score_cohort_promedio: 45
      intervencion_sugerida: >
        Recortar a 1 solo ejemplo (colorear mapa). 4-reinas queda como
        ejercicio del TP (ej28). En clase sólo esqueleto generate-and-test.

  zona_activa:
    tema: "Bloque 1 — Unificación + Bloque 8 — Listas"
    perfiles_que_se_estabilizan: [todos]
    oportunidad: "Es el bloque donde todos los perfiles se estabilizan sobre 65."

  zona_recuperacion_guia:
    perfil: ansioso
    delta: "+16 pts (58 → 74) en score global"
    bloques_clave: [B2_SLD, B3_backtracking, B9_acumulador]
    detalle: >
      La guía cumple función compensatoria crítica con ejemplos completos
      de árbol SLD trazado y acumulador paso a paso. Comunicar en clase:
      "esta sección está desarrollada a fondo en la guía de estudio".

  faq_anticipado_criticos:
