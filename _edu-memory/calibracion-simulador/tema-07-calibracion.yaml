# NOTA: Este archivo NUNCA se resetea — acumula calibración año a año

tema:
  numero: "07"
  nombre: "Paradigma Lógico Avanzado — Prolog (Clase 2+3)"
  duracion_clase: 240
  bloques: 14
  artefactos_evaluados:
    - diseno.md
