name: Autograding Tests

on:
  - push
  - workflow_dispatch

permissions:
  actions: read
  contents: read
  checks: write

jobs:
  autograding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejercicio 01 — es_par
        id: ej01
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 01 — es_par
          command: python -m unittest tests.test_ej01 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 02 — invertir_cadena
        id: ej02
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 02 — invertir_cadena
          command: python -m unittest tests.test_ej02 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 03 — maximo_de_tres
        id: ej03
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 03 — maximo_de_tres
          command: python -m unittest tests.test_ej03 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 04 — contar_vocales
        id: ej04
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 04 — contar_vocales
          command: python -m unittest tests.test_ej04 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 05 — es_palindromo
        id: ej05
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 05 — es_palindromo
          command: python -m unittest tests.test_ej05 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 06 — dividir
        id: ej06
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 06 — dividir
          command: python -m unittest tests.test_ej06 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 07 — validar_edad
        id: ej07
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 07 — validar_edad
          command: python -m unittest tests.test_ej07 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 08 — Pila
        id: ej08
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 08 — Pila
          command: python -m unittest tests.test_ej08 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 09 — calcular_descuento
        id: ej09
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 09 — calcular_descuento
          command: python -m unittest tests.test_ej09 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 10 — validar_contrasenia
        id: ej10
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 10 — validar_contrasenia
          command: python -m unittest tests.test_ej10 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 11 — Contador con setUp
        id: ej11
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 11 — Contador con setUp
          command: python -m unittest tests.test_ej11 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 12 — ListaOrdenada
        id: ej12
        uses: classroom-resources/autograding-command-grader@v1
