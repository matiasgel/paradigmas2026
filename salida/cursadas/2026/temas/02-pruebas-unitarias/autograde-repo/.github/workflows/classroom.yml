          command: python -m unittest tests.test_ej17 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 18 — Notificador con patch
        id: ej18
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 18 — Notificador con patch
          command: python -m unittest tests.test_ej18 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 19 — Calculadora con subTest
        id: ej19
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 19 — Calculadora con subTest
          command: python -m unittest tests.test_ej19 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 20 — GestorTareas integrador
        id: ej20
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 20 — GestorTareas integrador
          command: python -m unittest tests.test_ej20 -v
          timeout: 10
          max-score: 5

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          EJ01_RESULTS: "${{steps.ej01.outputs.result}}"
          EJ02_RESULTS: "${{steps.ej02.outputs.result}}"
          EJ03_RESULTS: "${{steps.ej03.outputs.result}}"
          EJ04_RESULTS: "${{steps.ej04.outputs.result}}"
          EJ05_RESULTS: "${{steps.ej05.outputs.result}}"
          EJ06_RESULTS: "${{steps.ej06.outputs.result}}"
          EJ07_RESULTS: "${{steps.ej07.outputs.result}}"
          EJ08_RESULTS: "${{steps.ej08.outputs.result}}"
          EJ09_RESULTS: "${{steps.ej09.outputs.result}}"
          EJ10_RESULTS: "${{steps.ej10.outputs.result}}"
          EJ11_RESULTS: "${{steps.ej11.outputs.result}}"
          EJ12_RESULTS: "${{steps.ej12.outputs.result}}"
          EJ13_RESULTS: "${{steps.ej13.outputs.result}}"
          EJ14_RESULTS: "${{steps.ej14.outputs.result}}"
          EJ15_RESULTS: "${{steps.ej15.outputs.result}}"
          EJ16_RESULTS: "${{steps.ej16.outputs.result}}"
          EJ17_RESULTS: "${{steps.ej17.outputs.result}}"
          EJ18_RESULTS: "${{steps.ej18.outputs.result}}"
          EJ19_RESULTS: "${{steps.ej19.outputs.result}}"
          EJ20_RESULTS: "${{steps.ej20.outputs.result}}"
        with:
          runners: ej01,ej02,ej03,ej04,ej05,ej06,ej07,ej08,ej09,ej10,ej11,ej12,ej13,ej14,ej15,ej16,ej17,ej18,ej19,ej20
