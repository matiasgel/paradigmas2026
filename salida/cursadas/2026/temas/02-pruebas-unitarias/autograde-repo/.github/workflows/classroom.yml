          test-name: Ejercicio 13 — CuentaBancaria
          command: python -m unittest tests.test_ej13 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 14 — ConversorTemperatura
        id: ej14
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 14 — ConversorTemperatura
          command: python -m unittest tests.test_ej14 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 15 — Agenda
        id: ej15
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 15 — Agenda
          command: python -m unittest tests.test_ej15 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 16 — Mock archivos
        id: ej16
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ejercicio 16 — Mock archivos
          command: python -m unittest tests.test_ej16 -v
          timeout: 10
          max-score: 5

      - name: Ejercicio 17 — Mock servicio externo
        id: ej17
