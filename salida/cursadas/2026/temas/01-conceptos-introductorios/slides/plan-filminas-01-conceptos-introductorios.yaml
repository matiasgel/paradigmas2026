- id: F-17
  type: codigo
  title: 'El mismo problema: imperativo en TypeScript'
  subtitle: TypeScript — estilo imperativo
  body_blocks:
  - type: list
    items:
    - '**Diferencias respecto de C:**'
    - '- Tipos anotados (`: number[]`, `: number`)'
    - '- Sin gestión manual de punteros'
    - '- Mismo paradigma — **imperativo**'
  code_blocks:
  - lang: typescript
    content: "function sumaAbs(arr: number[]): number {\n    let acc = 0;\n    for\
      \ (let i = 0; i < arr.length; i++) {\n        acc += arr[i] < 0 ? -arr[i] :\
      \ arr[i];\n    }\n    return acc;\n}\n\nconsole.log(sumaAbs([3, -1, 4, -1, 5]));\
      \ // → 14"
