- id: F-18
  type: codigo
  title: 'El mismo problema: funcional en TypeScript'
  subtitle: TypeScript — estilo funcional
  body_blocks:
  - type: list
    items:
    - '**¿Qué cambió?**'
    - '- Sin `let` → sin mutación de estado'
    - '- Sin loop explícito'
    - '- `map` y `reduce` son **funciones de orden superior** (reciben funciones como
      argumento)'
  - type: text
    content: '> En Scheme (LISP, 1960): `(reduce + (map abs lista))`

      > La misma idea tiene 60 años. TypeScript la adopta en 2012.'
  - type: list
    items:
    - '*Fuente: Louden & Lambert, Cap. 1*'
  code_blocks:
  - lang: typescript
    content: "const sumaAbs = (arr: number[]): number =>\n    arr.map(x => Math.abs(x))\n\
      \       .reduce((acc, x) => acc + x, 0);\n\nconsole.log(sumaAbs([3, -1, 4, -1,\
      \ 5])); // → 14"
