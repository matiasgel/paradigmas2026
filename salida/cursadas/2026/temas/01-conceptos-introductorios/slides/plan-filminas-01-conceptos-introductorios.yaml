- id: F-08
  type: codigo
  title: El cuello de botella de Von Neumann
  subtitle: La ejecución secuencial es una restricción del hardware, no una verdad
    universal
  body_blocks:
  - type: list
    items:
    - '**Consecuencias:**'
    - '- Limita el paralelismo natural'
    - '- Limita el cómputo no determinista'
  - type: list
    items:
    - '**Pregunta que generó nuevos paradigmas:**'
    - '> *¿Se puede describir cómputo **sin** depender de Von Neumann?*'
  - type: text
    content: '→ **Funcional:** cálculo lambda (Church, 1936)

      → **Lógico:** lógica simbólica y resolución (Robinson, 1965)'
  - type: list
    items:
    - '*Fuente: Louden & Lambert, Cap. 1*'
  code_blocks:
