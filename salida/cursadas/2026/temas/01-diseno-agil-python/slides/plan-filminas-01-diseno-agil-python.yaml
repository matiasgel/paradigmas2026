  title: PEP 484 + evolución reciente
  subtitle: Cronología de type hints en Python
  body_blocks:
  - type: heading
    level: 2
    content: Hoy usamos
  - type: list
    ordered: false
    items:
    - content: Python 3.13 → usar la sintaxis moderna (`list[int]`, `X | Y`)
