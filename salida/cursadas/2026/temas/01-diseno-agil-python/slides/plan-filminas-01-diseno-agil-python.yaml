- id: F-02
  type: concepto-abstracto
  title: ¿Qué es el Modelo Ágil?
  subtitle: Una forma diferente de construir software
  body_blocks:
  - type: heading
    level: 2
    content: ¿De dónde viene?
  - type: list
    ordered: false
    items:
    - content: Surge como respuesta al modelo de **cascada** (waterfall, 1970s)
      level: 0
    - content: 'En cascada: fases secuenciales, sin vuelta atrás'
      level: 0
    - content: 'Problema: el cliente recibe software meses después y no era lo que
        quería'
      level: 0
  - type: heading
    level: 2
    content: La propuesta ágil
  - type: list
    ordered: false
    items:
    - content: '**Iteraciones cortas** (semanas, no meses)'
      level: 0
    - content: Software funcional al final de cada iteración
      level: 0
    - content: '**Feedback continuo** del usuario → ajustes permanentes'
      level: 0
    - content: Equipos pequeños, comunicación directa
      level: 0
