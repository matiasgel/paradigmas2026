  code_blocks:
  - lang: python
    content: "def factorial(n: int) -> int:\n    \"\"\"Calcula n! recursivamente.\n\
      \n    Args:\n        n: Número entero no negativo.\n\n    Returns:\n       \
      \ El factorial de n.\n    \"\"\"\n    if n == 0 or n == 1:   # Caso base\n \
      \       return 1\n    return n * factorial(n - 1)   # Caso recursivo\n\nprint(factorial(5))\
      \   # 120"
  - lang: text
    content: "factorial(5)\n  = 5 * factorial(4)\n  = 5 * 4 * factorial(3)\n  = 5\
      \ * 4 * 3 * factorial(2)\n  = 5 * 4 * 3 * 2 * factorial(1)\n  = 5 * 4 * 3 *\
      \ 2 * 1 = 120"
