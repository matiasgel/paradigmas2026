  - type: list
    ordered: false
    items:
    - content: '**Pylance** → detecta errores de tipo antes de ejecutar'
      level: 0
    - content: '**Ruff** → 100× más rápido que Flake8, reemplaza Black + isort'
      level: 0
    - content: '**GitLens** → hace visible el historial directamente en el editor'
