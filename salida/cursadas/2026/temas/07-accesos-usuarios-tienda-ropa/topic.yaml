  prepared_repository: "Proyecto Django, requirements.txt, MiniStore y configuración Jazzmin preparados; las apps accounts y products todavía no creadas"
  environment_setup: "La clase incluye crear y activar .venv, instalar requirements.txt y verificar versiones antes de ejecutar Django"
  continuity: "No saltear ni comprimir bloques para terminar en una sesión; cerrar cada clase en un checkpoint consistente y continuar después"
  optional_cart: "Después de cerrar C07-v01, implementar si se decide continuar: carrito público en sesión y persistencia para cliente autenticado"
