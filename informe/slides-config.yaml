# Sistema de diseno para filminas del curso
# Base visual: plantilla local + referencia institucional UNTdF

palette:
  # Tomada del HTML/CSS institucional provisto por el docente (UNTDF).
  primary: "#A9191B"    # color de marca en theme-color, titulos y botones rojos
  secondary: "#1773AE"  # color de enlaces institucionales
  accent: "#A01818"     # variante roja de cabeceras responsive
  background: "#FFFFFF" # fondo principal
  text: "#3C3C3B"       # color tipografico base en headings
  muted_text: "#444242" # color tipografico de parrafos
  surface: "#F4F4F4"    # fondos neutros de modulos
  border: "#D7D7D7"     # bordes y sombras suaves

institutional_reference:
  institution: "Universidad Nacional de Tierra del Fuego"
  website: "https://www.untdf.edu.ar/"
  base_template_file: "temas/Functional Programming.pptx"
  base_template_theme: "Simple Light"

brand_validation:
  integrated_browser_fetch:
    status: "blocked_then_validated_by_user_source"
    reason: "HTTP 429 on live fetch; validated from user-provided HTML/CSS"
    attempted_urls:
      - "https://www.untdf.edu.ar/"
      - "https://untdf.edu.ar/"
      - "https://www.untdf.edu.ar/index.php"
  validated_tokens:
    - "meta theme-color: #a9191b"
    - "header-responsive background: #a01818"
    - "links: #1773ae"
    - "heading text: #3c3c3b"
    - "body text: #444242"
    - "neutral backgrounds: #f4f4f4"
  source: "HTML/CSS compartido por el docente desde navegador integrado"
  next_step: "opcional: contrast check por layout con contenido real de clase"

# Tipografia institucional detectada en CSS UNTdF.
typography:
  title:
    font: "Roboto Bold"
    size: 46
    weight: 700
  heading:
    font: "Roboto Medium"
    size: 32
    weight: 600
  body:
    font: "Roboto"
    size: 21
    weight: 400
  code:
    font: "Consolas"
    size: 18
    weight: 400
  ui_menu:
    font: "Roboto Condensed"
    size: 20
    weight: 700

# Layouts por tipo de filmina
layouts:
  portada:
    description: "Título centrado grande + subtítulo + logo"
  concepto-abstracto:
    description: "Título + cuerpo de texto + imagen Gemini alineada a la derecha"
  codigo:
    description: "Título + bloque de código monoespaciado + output esperado"
  tabla-comparativa:
    description: "Título + tabla full-width" 
  pregunta-socrática:
    description: "Pregunta centrada grande + espacio visual" 
  timeline:
    description: "Título + línea temporal horizontal" 
  cierre:
    description: "Frase clave centrada + call-to-action" 
  demo-herramienta:
    description: "Título + pasos numerados + captura/imagen" 

# Plantilla de Google Slides:
# - Si hay template institucional en Drive, reemplazar con su ID.
# - Mientras tanto, se usa 0 para mantener consistencia de exportacion.
template_id: "1mGncfOizGbRHXNo5xqi9wfqePnlnGKbZUtlvTysYMsI"

# Estrategia de imágenes Gemini (dónde colocar imágenes generadas)
# Nota: Se usa para controlar el presupuesto de imágenes en la presentación.
# El campo "max_per_presentation" indica cuántas imágenes generar como máximo.
gemini_image_strategy:
  max_per_presentation: 8
  default: "right"
