- id: F-09
  type: diagrama
  title: 'HTML: El árbol DOM'
  subtitle: ''
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: '**Título:** Cómo HTML forma una estructura de árbol'
      level: 0
  - type: list
    ordered: false
    items:
    - content: '**Conceptos clave:**'
      level: 0
    - content: '**parent** → el elemento que contiene a otro (`nav` es parent de `ul`)'
      level: 0
    - content: '**child/hijo** → elemento dentro de otro (`ul` es child de `nav`)'
      level: 0
    - content: '**siblings/hermanos** → elementos al mismo nivel (`li` son hermanos
        entre sí)'
      level: 0
  code_blocks:
  - lang: text
    content: "document\n└── html\n    ├── head\n    │   ├── meta (charset)\n    │\
      \   ├── meta (viewport)\n    │   ├── title\n    │   └── link (stylesheet)\n\
      \    └── body\n        ├── header\n        │   └── nav\n        │       ├──\
      \ a.navbar-brand  ← hijo de nav\n        │       └── ul.navbar-nav\n       \
      \ │           ├── li.nav-item ← hermanos entre sí\n        │           └── li.nav-item\n\
      \        ├── main\n        │   └── section\n        │       └── div.row\n  \
      \      │           ├── article.col-md-4 ← hermanos\n        │           ├──\
      \ article.col-md-4\n        │           └── article.col-md-4\n        └── footer"
