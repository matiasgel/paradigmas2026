- id: F-15
  type: tabla-mixta
  title: 'CSS: Selectores'
  subtitle: ''
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: '**Título:** Cómo apuntar a los elementos'
      level: 0
  - type: list
    ordered: false
    items:
    - content: '**Especificidad (quién gana cuando hay conflicto):**'
      level: 0
  code_blocks:
  - lang: css
    content: '/* 1. Selector de ELEMENTO — aplica a todos los h1 */

      h1 { color: #333; }


      /* 2. Selector de CLASE — aplica a todo lo que tenga class="card" */

      .card { border-radius: 8px; }


      /* 3. Selector de ID — aplica solo al elemento con id="navbar" */

      #navbar { background-color: white; }


      /* 4. Selector DESCENDIENTE — solo p dentro de article */

      article p { line-height: 1.7; }


      /* 5. Selector de HIJO DIRECTO */

      nav > ul { list-style: none; }


      /* 6. Selector de ATRIBUTO */

      input[type="email"] { border-color: #0d6efd; }


      /* 7. Pseudo-clase */

      a:hover { color: #0d6efd; text-decoration: underline; }

      button:focus { outline: 2px solid #0d6efd; }'
  - lang: text
    content: "!important > inline style > #id > .class > element\n    ∞          \
      \    1000       100     10       1"
