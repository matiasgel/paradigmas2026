      level: 0
  - type: list
    ordered: false
    items:
    - content: '**Regla CSS = Selector + Declaraciones:**'
      level: 0
  - type: text
    content: '> **"Cascading"** = cuando múltiples reglas aplican al mismo elemento,
      gana la más específica.'
  code_blocks:
  - lang: css
    content: "           selector\n              ↓\nh1 { color: #CC9900; font-size:\
      \ 2rem; }\n     ────────────────────────────────\n           declaraciones\n\
      \           (propiedad: valor;)"
  tables:
  - '| Controla | Ejemplos |

    |----------|---------|

    | Color | `color: #333; background-color: #f8f9fa;` |

    | Tipografía | `font-size: 1.2rem; font-weight: bold;` |

    | Espaciado | `margin: 16px; padding: 8px 16px;` |

    | Disposición | `display: flex; grid-template-columns: ...` |

    | Responsive | `@media (min-width: 768px) { ... }` |

    | Animaciones | `transition: all 0.3s ease;` |'
