      \ white;\n  padding: 8px 20px;\n  border: none;\n  border-radius: var(--border-radius);\n\
      \  cursor: pointer;\n  transition: background-color 0.2s ease, transform 0.1s\
      \ ease;\n}\n\n.btn-custom:hover {\n  background-color: #0b5ed7;   /* más oscuro\
      \ */\n  transform: translateY(-2px); /* sube 2px */\n}\n\n.btn-custom:active\
      \ {\n  transform: translateY(0);    /* vuelve al lugar al hacer clic */\n}\n\
      \n/* Links de navegación */\n.nav-link {\n  transition: color 0.15s ease;\n\
      }\n.nav-link:hover { color: var(--color-primario) !important; }\n\n/* Cards\
      \ con efecto de elevación */\n.card {\n  transition: box-shadow 0.2s ease, transform\
      \ 0.2s ease;\n}\n.card:hover {\n  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);\n\
      \  transform: translateY(-4px);\n}"
