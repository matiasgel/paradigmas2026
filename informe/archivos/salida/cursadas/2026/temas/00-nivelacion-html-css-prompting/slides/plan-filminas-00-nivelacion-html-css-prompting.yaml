- id: F-18
  type: concepto-mixto
  title: 'CSS: Variables (Custom Properties)'
  subtitle: ''
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: '**Título:** Define una vez, usa en todo el proyecto'
      level: 0
  - type: list
    ordered: false
    items:
    - content: '**Ventaja:** Cambiar el color primario en **una sola línea** actualiza
        todo el sitio.'
      level: 0
  code_blocks:
  - lang: css
    content: "/* Declarar variables en :root → disponibles en todo el CSS */\n:root\
      \ {\n  /* Paleta de colores */\n  --color-primario:   #0d6efd;\n  --color-secundario:\
      \ #6c757d;\n  --color-fondo:      #f8f9fa;\n  --color-texto:      #212529;\n\
      \n  /* Tipografía */\n  --fuente-principal: 'Segoe UI', system-ui, sans-serif;\n\
      \  --size-base:        1rem;      /* 16px en la mayoría de browsers */\n\n \
      \ /* Espaciado */\n  --espacio-sm:  8px;\n  --espacio-md:  16px;\n  --espacio-lg:\
      \  32px;\n\n  /* Bordes */\n  --border-radius: 8px;\n}\n\n/* Usar las variables\
      \ con var() */\nbody {\n  font-family: var(--fuente-principal);\n  color: var(--color-texto);\n\
      \  background-color: var(--color-fondo);\n}\n\n.btn-custom {\n  background-color:\
      \ var(--color-primario);\n  padding: var(--espacio-sm) var(--espacio-md);\n\
      \  border-radius: var(--border-radius);\n}"
