- id: F-33
  type: concepto-mixto
  title: Validación con CSS :valid/:invalid
  subtitle: ''
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: '**Título:** Feedback visual de formulario con CSS puro'
      level: 0
  - type: list
    ordered: false
    items:
    - content: '**Explicación:**'
      level: 0
    - content: '`:valid` → cuando el valor cumple las restricciones HTML5'
      level: 0
    - content: '`:invalid` → cuando no cumple (email mal formado, required vacío)'
      level: 0
    - content: '`:not(:placeholder-shown)` → no mostrar errores hasta que el usuario
        empiece a escribir'
      level: 0
  code_blocks:
  - lang: css
    content: "/* styles.css */\n\n/* Campo válido → borde verde */\n.form-control:valid:not(:placeholder-shown)\
      \ {\n  border-color: #198754;\n  box-shadow: 0 0 0 0.25rem rgba(25, 135, 84,\
      \ 0.25);\n}\n\n/* Campo inválido → borde rojo */\n.form-control:invalid:not(:placeholder-shown)\
      \ {\n  border-color: #dc3545;\n  box-shadow: 0 0 0 0.25rem rgba(220, 53, 69,\
      \ 0.25);\n}"
  tables:
  - '| Pseudo-clase | Cuándo activa |

    |--------------|---------------|

    | `:valid` | El valor cumple las restricciones HTML5 (`required`, `type="email"`,
    `minlength`) |

    | `:invalid` | No cumple las restricciones |

    | `:not(:placeholder-shown)` | El usuario ya escribió algo (campo no vacío) |'
