- id: F-17
  type: concepto-abstracto
  title: CSS Box Model
  subtitle: ''
  body_blocks:
  - type: list
    ordered: false
    items:
    - content: '**Título:** Todo elemento es una caja'
      level: 0
  - type: text
    content: '> Con `box-sizing: border-box`, el `padding` y `border` **se incluyen**
      dentro del `width` declarado.'
  code_blocks:
  - lang: text
    content: '┌─────────────────────────────────────┐

      │  MARGIN (espacio externo)            │

      │  ┌───────────────────────────────┐  │

      │  │  BORDER (borde visible)        │  │

      │  │  ┌─────────────────────────┐  │  │

      │  │  │  PADDING (espacio intern │  │  │

      │  │  │  ┌───────────────────┐  │  │  │

      │  │  │  │  CONTENT          │  │  │  │

      │  │  │  └───────────────────┘  │  │  │

      │  │  └─────────────────────────┘  │  │

      │  └───────────────────────────────┘  │

      └─────────────────────────────────────┘'
  - lang: css
    content: "/* SIEMPRE incluir esto — evita sorpresas de ancho */\n*, *::before,\
      \ *::after { box-sizing: border-box; }\n\n.card-post {\n  width: 300px;    \
      \   /* ancho del contenido */\n  padding: 20px;      /* espacio interno */\n\
      \  border: 1px solid #dee2e6;\n  border-radius: 8px;\n  margin-bottom: 24px;\
      \ /* espacio externo abajo */\n}"
